[project]
name = "knowledgehub-backend"
version = "0.1.0"
description = "Enterprise Knowledge Intelligence Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",

    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",

    # Redis & Celery
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",

    # LLM & Embeddings
    "openai>=1.57.0",
    # Default embedding provider (local ONNX, no API key required)
    "fastembed>=0.5.0",

    # Document parsing
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.0",
    "pandas>=2.2.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.0",

    # Utilities
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# Fully offline speech-to-text. Not required by default: the Groq backend is
# free and needs no local model.
local-stt = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
